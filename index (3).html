ct\nwith water (solution is neutral).\n- The cations derived from weak bases (NH4+, Cu2+, Fe2+)\nreact with water to produce hydronium ion, H30+, (solution is\nacidic).\n- The anions derived from weak acids (F-, CH3COO-, CO32-,\nCN-) react with water to produce hydroxide ion, OH-,\n(solution is basic).\nNow, let us classify NaCl, K2CO3, and NH4ClI solutions as\nacidic, basic, or neutral. NaCl, when sodium chloride dissolves\nin water, it produces sodium and chloride ions.", "NaCl + H20 — Na+ +Cl-+H20 pH=7\nNa+ is a cation of a strong base, NaOH, and Cl- is an anion of\na strong acid, HCI. So, both ion do not hydrolyze. Therefore,\nsodium chloride solution is neutral. K2CO3, potassium\ncarbonate solution contains potassium and carbonate ions. K+\nis derived from a strong base, KOH, and CO32- is derived\nfrom a weak acid, H2CO3. Thus, only carbonate ions (CO32-)\nreact with water to produce hydroxide ion:\nK2CO3 + H20 — KHCO3 + KOH 2K+ + CO32- + H20 — 2K+ +\nHCO32- + OH-\nCO32- + H2O0 — HCO3- + OH- pH >7\nThe resulting hydroxide OH- ion shows that the potassium\ncarbonate solution is basic. It will turn litmus paper to blue.\nNH4Cl, ammonium chloride solution contains ammonium and\nchloride ions. Since Cl- is an anion of a strong acid, HCI, it\ndoes not undergo a hydrolysis reaction. NH4+ is a cation of a\nweak base, NH4OH. Therefore, it hydrolyzes to produce a\nhydronium ion:\nNH4Cl + H20 — NH40OH + HCI\nNH4+ + Cl- + H20 — NH4OH +H++Cl- pH<7\nThe resulting hydronium ion (H30+) shows that the\nammonium chloride solution is acidic and turn litmus paper to\nred.", ": PH scale\ni il F\no@ OSC\n| 5 Oe G 4\nyeaadnale\ni\nacidic neutral alkaline\nfies\nThe pH value of some substances", "= “ >\na ae |\n¥ fie\nfai al s\na ae\nHandmade soap\n‘= | “\n\\%\nSoap gives basic medium\nLaboratory work\nN22. Hydrolysis of salts\nMaterials:", "beakers, stirring rod, universal indicator, 1M solutions of\nsodium chloride, sodium carbonate, ammonium sulfate, lead\n(Il) nitrate, sodium pho time (At).\nOr “speed” = Ad /At. We can defi ne the rate of reaction as\nchange in amount (concentration, mass, volume, mole) Ax\nover a definite period of time (second, minute, hour etc.) At.\nOr", "where x can be mass m, volume V, mole n.\nFactors affecting the rate of reaction\nScientists studied many reactions to understand which\nfactors affect the rate of reactions. It was discovered that\nthere are five main factors which affect reaction rate:\n- The surface area of any solid reactant\nThe rate of a reaction increases when we increase the surface\narea of a solid.\n- The concentration of reactant\nThe rate of a reaction increases when we increase the\nconcentration of a reactant in solution.\n- The temperature at which the reaction happens\nThe rate of a reaction increases when we increase the\ntemperature of the reaction mixture.\n- Use of catalyst\nThe rate of a reaction increases when the catalyst is added in\nthe reaction.\n- Light, also, can infl uence some reactions."];

function md(t){const Z=[];t=t.replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g,m=>'\u0001'+(Z.push(m)-1)+'\u0001');

 for(const l of t.split('\n')){let m;
  if(m=l.match(/^(#{1,3})\s+(.*)/)){cl();const h=m[1].length+1;o+=`<h${h}>${I(m[2])}</h${h}>`}
  else if(m=l.match(/^\s*([-*]|\d+\.)\s+(.*)/)){const k=/\d/.test(m[1])?'ol':'ul';if(L!=k){cl();o+='<'+k+'>';L=k}o+='<li>'+I(m[2])+'</li>'}
  else if(/^\s*\|/.test(l)){if(/^[\s|:-]+$/.test(l))continue;if(L)cl();const h=!T;if(h){o+='<table>';T=1}o+='<tr>'+l.trim().replace(/^\||\|$/g,'').split('|').map(x=>`<${h?'th':'td'}>${I(x.trim())}</${h?'th':'td'}>`).join('')+'</tr>'}

 cl();return o.replace(/\u0001(\d+)\u0001/g,(_,i)=>esc(Z[i]))}

const okq=q=>q&&q.q&&q.o&&typeof q.c=='string'&&q.c.length==1&&'ABCD'.includes(q.c)&&[...'ABCD'].every(k=>String(q.o[k]==null?'':q.o[k]).trim());
function shuf(q){const K=['A','B','C','D'];if(K.some(k=>/above|both|all of|none of|\b[A-D]\s*(\+|and)\s*[A-D]\b|жоғарыдағы|барлығы/i.test(q.o[k])))return q;
 const p=[...K].sort(()=>Math.random()-.5),o={},f={},h=q.of&&q.of.A;K.forEach((k,i)=>{o[k]=q.o[p[i]];if(h)f[k]=q.of[p[i]]});return{...q,o,of:h?f:null,c:K[p.indexOf(q.c)]}}
async function verify(qs){const idx=qs.map((q,i)=>i).filter(i=>!qs[i].fig&&!(qs[i].of&&qs[i].of.A)),bad=new Set(),ch=[];
 for(let i=0;i<idx.length;i+=10)ch.push(idx.slice(i,i+10));say('Проверяю ответы вторым проходом…');
 await Promise.allSettled(ch.map(c=>aj([{role:'system',content:sys()},{role:'user',content:'Solve each multiple-choice question independently and carefully. Return JSON {"r":["A","C",...]}: the letter you believe is correct for each question in order, or "?" if none or several fit.\n'+c.map((i,k)=>`${k+1}. ${qs[i].q}\n`+['A','B','C','D'].map(l=>l+') '+qs[i].o[l]).join('\n')).join('\n\n')}],4000).then(r=>c.forEach((i,k)=>{const a=[].concat(r.r||[])[k];if(a&&a!=qs[i].c)bad.add(i)}))));
 return qs.filter((_,i)=>!bad.has(i))}
async function mkTest(t){const tk=++S.tk,n=+$('#cnt').value,ex=t=='exam',F=['algebra','physics'].includes(S.sub.id);say('Планирую вопросы…');try{
 const kind=ex?`BTS exam-format questions (formal style such as "Which of the following...", mixed difficulty from easy to hard${F?', about a third based on a graph or figure':''})`:`level ${t} questions: ${{A:'easy, definitions and direct formula use',B:'medium, multi-step applications',C:'hard, olympiad-style, several steps, tricky distractors'}[t]}`;
 let qs=await mass(kind,QEX+(F?FIG:'Do not use figures (fig=null).'),n+3,10,'qs',okq);if(tk!=S.tk)return;qs=(await verify(qs)).slice(0,n).map(shuf);if(tk!=S.tk)return;
 if(qs.length<20)throw new Error(`ИИ создал только ${qs.length} корректных вопросов. Нажмите «Создать» ещё раз.`);
 S.run={qs,cur:0,ans:{},ex,t,t0:Date.now()};runQ()}catch(e){if(tk==S.tk)err(e)}}
const SHEET=`<details class="card"><summary><b>Шпаргалка (как в экзамене)</b></summary><p>$A_x=A\\cos\\theta,\\ A_y=A\\sin\\theta$ · $\\sin30°=\\cos60°=0{,}5$, $\\sin37°=\\cos53°=0{,}6$, $\\sin45°=\\cos45°=\\frac{\\sqrt2}{2}$, $\\sin53°=\\cos37°=0{,}8$, $\\sin60°=\\cos30°=\\frac{\\sqrt3}{2}$</p><p>$x=x_0+v_0t+\\frac{at^2}{2}$, $v=v_0+at$, $v^2=v_0^2+2a\\Delta x$ · падение: $h=\\frac{gt^2}{2}$, $v=gt$, $v^2=2gh$</p><p>$\\pi\\ rad=180°$, $v=\\frac{2\\pi r}{T}$, $\\omega=\\frac{2\\pi}{T}$, $f=\\frac1T$, $a^2+b^2=c^2$</p></details>`;
function runQ(){const r=S.run,q=r.qs[r.cur];
 M.innerHTML=`<div class="top"><b>${r.ex?'Экзамен БТС':'Уровень '+r.t} · ${S.sub.n}</b><span class="mu">${r.cur+1}/${r.qs.length}</span></div>${r.ex&&S.sub.id=='physics'?SHEET:''}
 <div class="navg">${r.qs.map((_,i)=>`<i class="${i==r.cur?'cur':r.ans[i]?'don':''}" onclick="S.run.cur=${i};runQ()">${i+1}</i>`).join('')}</div>
 <div class="card"><div class="q">${esc(q.q)}</div>${fig(q.fig)}</div>
 <div class="opts">${['A','B','C','D'].map(k=>`<button class="opt ${r.ans[r.cur]==k?'sel':''}" onclick="S.run.ans[S.run.cur]='${k}';runQ()"><b>${k}</b><span>${esc(q.o[k])}${q.of&&q.of[k]?fig(q.of[k]):''}</span></button>`).join('')}</div>
 <div class="row"><button class="btn g2" ${r.cur?'':'disabled'} onclick="S.run.cur--;runQ()">← Назад</button>${r.cur<r.qs.length-1?'<button class="btn" onclick="S.run.cur++;runQ()">Далее →</button>':'<button class="btn" onclick="fin()">Завершить ✓</button>'}</div>`;kx();scrollTo(0,0)}
function fin(){const r=S.run,n=r.qs.length,un=n-Object.keys(r.ans).length;if(un&&!confirm('Без ответа: '+un+'. Завершить?'))return;
 const ok=r.qs.filter((q,i)=>r.ans[i]==q.c).length;
 M.innerHTML=`<div class="center"><div class="big">${Math.round(ok/n*100)}%</div><p class="mu">${ok} из ${n} верно · ${Math.round((Date.now()-r.t0)/60000)} мин</p></div><label class="mu"><input type="checkbox" onchange="document.body.classList.toggle('only',this.checked)"> Показать только ошибки</label>
 ${r.qs.map((q,i)=>{const g=r.ans[i]==q.c;return `<div class="card rv ${g?'ok':'no'}"><b>${i+1}. ${g?'✅':'❌'}</b><div class="q">${esc(q.q)}</div>${fig(q.fig)}<p class="mu">Ваш ответ: ${r.ans[i]||'—'} · Верный: <b>${q.c}</b> — ${esc(q.o[q.c])}${q.of&&q.of[q.c]?fig(q.of[q.c]):''}</p><p>💡 ${esc(q.e)}</p></div>`}).join('')}
 <div class="row"><button class="btn" onclick="view()">Новый тест</button></div>`;kx();scrollTo(0,0)}
/* ---------- flashcards ---------- */
async function mkCards(){const tk=++S.tk;say('Планирую карточки…');try{
 const c=(await mass('flashcards (term or question on the front, answer on the back), each covering a different fact worth memorising',`Return JSON {"cards":[{"f":"front: term or short question","b":"back: concise correct answer (LaTeX in $..$)"}]}.`,31,13,'cards',x=>x&&x.f&&x.b)).slice(0,40);if(tk!=S.tk)return;
 if(c.length<30)throw new Error(`ИИ создал только ${c.length} карточек. Нажмите «Создать» ещё раз.`);
 S.deck={c,q:c.map((_,i)=>i),kn:0};card()}catch(e){if(tk==S.tk)err(e)}}
function card(){const d=S.deck;
 if(!d.q.length){M.innerHTML=`<div class="center"><div class="big">🎉</div><h2>Все ${d.c.length} карточек выучены!</h2><div class="row" style="justify-content:center"><button class="btn" onclick="S.deck.q=S.deck.c.map((_,i)=>i);S.deck.kn=0;card()">Повторить заново</button><button class="btn g2" onclick="view()">Назад</button></div></div>`;return}
 const c=d.c[d.q[0]];M.innerHTML=`<div class="top"><b>Карточки · ${S.sub.n}</b><span class="mu">Выучено ${d.kn} / ${d.c.length}</span></div><div class="bar"><u style="width:${d.kn/d.c.length*100}%"></u></div>
 <div class="flip" onclick="this.classList.toggle('on')"><div class="fi"><div class="ff card"><small>Вопрос</small><div>${esc(c.f)}</div></div><div class="ff fb card"><small>Ответ</small><div>${esc(c.b)}</div></div></div></div>
 <p class="mu center">Нажмите на карточку (или пробел), чтобы перевернуть</p><div class="row"><button class="btn g2" onclick="rate(0)">↻ Повторить</button><button class="btn" onclick="rate(1)">✓ Знаю</button></div>`;kx()}
function rate(k){const d=S.deck,i=d.q.shift();if(k)d.kn++;else d.q.push(i);card()}
document.addEventListener('keydown',e=>{if(!S.deck||!$('.flip'))return;if(e.code=='Space'){e.preventDefault();$('.flip').classList.toggle('on')}if(e.key=='ArrowRight')rate(1);if(e.key=='ArrowLeft')rate(0)});

function openSet(){$('#k').value=CFG.key;$('#u').value=CFG.base;$('#m').value=CFG.model;$('#ts').textContent='';$('#set').showModal()}
function sv(close){CFG.key=$('#k').value.trim();CFG.base=$('#u').value.trim()||CFG.base;CFG.model=$('#m').value.trim()||CFG.model;if(close){$('#set').close();S.sub?nav():home()}}
async function tst(){sv();$('#ts').textContent='Проверяю…';try{await ai([{role:'user',content:'Reply with OK'}],0,20);$('#ts').textContent='✅ Подключение работает'}catch(e){$('#ts').textContent='⚠ '+e.message}}
home();
